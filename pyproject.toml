[project]
name = "wealth-product-monitor"
version = "0.1.0"
description = "中国银行与中银理财公开产品信息监控"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.10,<5",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
